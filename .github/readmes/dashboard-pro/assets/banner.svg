<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="50%" stop-color="#0a1128"/>
      <stop offset="100%" stop-color="#02060d"/>
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00d2ff" stroke-width="0.5" stroke-opacity="0.07"/>
    </pattern>

    <style>
      .matrix-text {
        font-family: 'Courier New', monospace;
        font-size: 12px;
        fill: #00f0ff;
        opacity: 0.15;
      }
      .code-stream {
        animation: fadeStream 4s infinite alternate ease-in-out;
      }
      .code-stream-2 {
        animation: fadeStream 6s infinite alternate ease-in-out 1s;
      }
      .main-title {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-weight: 900;
        font-size: 82px;
        letter-spacing: 18px;
        fill: #ffffff;
      }
      .sub-title {
        font-family: 'Courier New', monospace;
        font-size: 14px;
        letter-spacing: 6px;
        fill: #00f0ff;
        opacity: 0.8;
      }
      .cursor {
        animation: blink 1s infinite;
      }

      @keyframes fadeStream {
        0% { opacity: 0.05; }
        100% { opacity: 0.25; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <rect width="850" height="260" rx="10" fill="url(#bgGradient)"/>
  <rect width="850" height="260" rx="10" fill="url(#grid)"/>

  <path d="M 50 0 L 50 260" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.1"/>
  <path d="M 800 0 L 800 260" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.1"/>
  <path d="M 0 40 L 850 40" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.08"/>
  <path d="M 0 220 L 850 220" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.08"/>

  <g class="matrix-text code-stream">
    <text x="70" y="80">01000010 01001001 01010100</text>
    <text x="70" y="110">root@zpt0:~# init_system</text>
    <text x="70" y="140">0x7F 0x3A 0xC4 0x12 0x89</text>
    <text x="70" y="170">CONNECT [OK] 127.0.0.1</text>
  </g>

  <g class="matrix-text code-stream-2">
    <text x="610" y="80">SYSTEM_READY // ZPT0</text>
    <text x="610" y="110">01010011 01000101 01000011</text>
    <text x="610" y="140">SHA-256: e3b0c44298fc1c14</text>
    <text x="610" y="170">PORT 8080: LISTENING</text>
  </g>

  <circle cx="430" cy="130" r="120" fill="#00d2ff" opacity="0.06" filter="url(#subtleGlow)"/>

  <text x="439" y="140" text-anchor="middle" class="main-title" filter="url(#subtleGlow)">ZPT0</text>

  <g transform="translate(425, 175)">
    <text x="0" y="0" text-anchor="middle" class="sub-title">> DEVELOPER / SECURITY_</text>
  </g>

  <path d="M 20 35 L 20 20 L 35 20" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.5"/>
  <path d="M 830 35 L 830 20 L 815 20" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.5"/>
  <path d="M 20 225 L 20 240 L 35 240" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.5"/>
  <path d="M 830 225 L 830 240 L 815 240" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.5"/>
</svg>